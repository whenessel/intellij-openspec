name: UI Smoke Journeys

# Execution policy (spec: ui-smoke-journeys): MANUAL DISPATCH ONLY. The self-hosted
# runner cannot boot a headful IDE (no virtual display), so an automatic run on a
# release tag is a guaranteed false-red that gates nothing real — the actual
# publish runs from GitHub's release.yml. The AUTHORITATIVE release gate is the
# maintainer's local `caffeinate -dimsu ./gradlew uiSmoke` run during release-prep
# (release-prep step 4b), never this CI job. This workflow is kept dispatchable so the
# suite can be run on demand if the runner ever gains a display (xvfb + node/npm for
# the OpenSpec CLI the Update/validate journeys need).
on:
  workflow_dispatch:

env:
  PATH: /opt/gradle-9.0.0/bin:/opt/apache-maven-3.9.9/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  ui-smoke:
    runs-on: java-21
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-uismoke-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-uismoke-

      - name: Verify display + CLI prerequisites
        run: |
          command -v Xvfb || echo "WARNING: Xvfb missing — Starter cannot create a virtual display"
          # Install the plugin's top-supported OpenSpec CLI, read from the single source of truth in
          # gradle.properties (never a hardcoded pin here — TargetVersionSingleSourceTest enforces it),
          # so the smoke journeys always run against the version the plugin actually targets.
          OSV=$(grep -E '^openspecTargetVersion=' gradle.properties | cut -d= -f2)
          command -v npm && npm i -g @fission-ai/openspec@"$OSV" \
            || echo "WARNING: npm missing — the OpenSpec CLI is needed for the Update and CLI-authoritative validate journeys"
          command -v openspec && openspec --version || true

      # Starter downloads its own IDE installer into out/ide-tests (an IDE-sized
      # artifact — deliberately NOT in the Gradle cache; same lesson as the verifier
      # cache scoping). Retry once at the job level per the flakiness policy.
      - name: Run UI smoke journeys
        run: gradle uiSmoke || gradle uiSmoke

      - name: Upload journey artifacts (logs + screenshots)
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-artifacts
          path: |
            out/perf-startup/tests/**/log/
            build/test-results/uiSmoke/
